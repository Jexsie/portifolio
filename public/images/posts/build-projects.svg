<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <rect width="600" height="300" rx="12" fill="#1a1b1e"/>
  <!-- Building blocks / projects -->
  <!-- Block 1 - small -->
  <rect x="120" y="190" width="80" height="60" rx="4" fill="#c792ea" opacity="0.15" stroke="#c792ea" stroke-width="1" stroke-opacity="0.4"/>
  <text x="135" y="225" font-family="monospace" font-size="11" fill="#c792ea" opacity="0.7">calc.js</text>
  <!-- Block 2 - medium -->
  <rect x="220" y="160" width="90" height="90" rx="4" fill="#82aaff" opacity="0.15" stroke="#82aaff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="232" y="210" font-family="monospace" font-size="11" fill="#82aaff" opacity="0.7">todo-app</text>
  <!-- Block 3 - taller -->
  <rect x="330" y="120" width="100" height="130" rx="4" fill="#c3e88d" opacity="0.15" stroke="#c3e88d" stroke-width="1" stroke-opacity="0.4"/>
  <text x="342" y="192" font-family="monospace" font-size="11" fill="#c3e88d" opacity="0.7">portfolio</text>
  <!-- Block 4 - tallest -->
  <rect x="450" y="70" width="100" height="180" rx="4" fill="#eabe7c" opacity="0.15" stroke="#eabe7c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="465" y="168" font-family="monospace" font-size="11" fill="#eabe7c" opacity="0.7">real-app</text>
  <!-- Arrow showing growth -->
  <path d="M155 180 Q300 50 505 60" stroke="#eabe7c" stroke-width="1.5" fill="none" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <polygon points="505,55 515,60 505,65" fill="#eabe7c" opacity="0.5"/>
  <!-- Label -->
  <text x="195" y="278" font-family="sans-serif" font-size="14" fill="#a1a1a2" letter-spacing="3">START SMALL → GROW BIG</text>
</svg>
