<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <rect width="600" height="300" rx="12" fill="#1a1b1e"/>
  <!-- Laptop base -->
  <rect x="170" y="180" width="260" height="10" rx="3" fill="#2c2c2d"/>
  <path d="M150 190 L170 180 L430 180 L450 190 Z" fill="#2c2c2d"/>
  <!-- Screen -->
  <rect x="195" y="60" width="210" height="125" rx="4" fill="#141516" stroke="#434445" stroke-width="1.5"/>
  <!-- Code lines on screen -->
  <rect x="215" y="80" width="60" height="6" rx="2" fill="#c792ea" opacity="0.6"/>
  <rect x="282" y="80" width="40" height="6" rx="2" fill="#82aaff" opacity="0.6"/>
  <rect x="215" y="96" width="80" height="6" rx="2" fill="#c3e88d" opacity="0.5"/>
  <rect x="215" y="112" width="50" height="6" rx="2" fill="#89ddff" opacity="0.5"/>
  <rect x="272" y="112" width="70" height="6" rx="2" fill="#f78c6c" opacity="0.5"/>
  <rect x="215" y="128" width="45" height="6" rx="2" fill="#c792ea" opacity="0.4"/>
  <rect x="215" y="144" width="90" height="6" rx="2" fill="#697098" opacity="0.4"/>
  <!-- WiFi signal -->
  <path d="M485 90 Q500 75 515 90" stroke="#eabe7c" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M490 100 Q500 90 510 100" stroke="#eabe7c" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="500" cy="106" r="2.5" fill="#eabe7c" opacity="0.7"/>
  <!-- Coffee cup -->
  <rect x="85" y="150" width="40" height="35" rx="3" fill="none" stroke="#eabe7c" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M125 160 Q140 165 125 175" stroke="#eabe7c" stroke-width="1.5" fill="none" stroke-opacity="0.4"/>
  <!-- Steam -->
  <path d="M95 145 Q98 135 101 145" stroke="#eabe7c" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M105 142 Q108 130 111 142" stroke="#eabe7c" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Label -->
  <text x="195" y="240" font-family="sans-serif" font-size="14" fill="#a1a1a2" letter-spacing="3">LAPTOP + INTERNET + YOU</text>
</svg>
